<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>promo tile</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 440px; height: 280px; overflow: hidden; position: relative;
    background: #0a0a0d; color: #fff;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  }
  .glow { position: absolute; width: 520px; height: 520px; right: -190px; top: -230px;
    background: radial-gradient(circle, rgba(240,0,43,.42) 0%, rgba(240,0,43,0) 62%); }
  .glow.left { left: -220px; right: auto; bottom: -300px; top: auto; width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(86,72,255,.16) 0%, rgba(86,72,255,0) 68%); }
  .inner { position: relative; height: 100%; padding: 34px 32px; display: flex; flex-direction: column; }
  img { width: 54px; height: 54px; border-radius: 13px; box-shadow: 0 10px 26px rgba(240,0,43,.3); }
  h1 { margin-top: 22px; font-size: 27px; font-weight: 800; letter-spacing: -.01em; }
  p { margin-top: 9px; font-size: 14.5px; line-height: 1.6; color: #a0a0ad; }
  p b { color: #ff3b4e; font-weight: 700; }
  .tag { margin-top: auto; font-size: 11.5px; letter-spacing: .12em; color: #6b6b78; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow left"></div>
  <div class="inner">
    <img src="../../icons/icon128.png" alt="">
    <h1>YouTube 續播助手</h1>
    <p>關掉瀏覽器，<b>進度還在</b>。<br>重新打開就接回原處。</p>
    <div class="tag">CHROME / EDGE</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>screenshot 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 800px; overflow: hidden; position: relative;
    background: #0a0a0d; color: #fff;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
  }
  .glow { position: absolute; width: 1100px; height: 700px; left: 50%; top: -420px; margin-left: -550px;
    background: radial-gradient(ellipse, rgba(240,0,43,.18) 0%, rgba(240,0,43,0) 64%); }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding-bottom: 10px; }
  h2 { font-size: 36px; font-weight: 800; letter-spacing: -.01em; text-align: center; }
  h2 span { color: #ff3b4e; }
  .sub { margin-top: 14px; font-size: 15px; color: #8b8b98; text-align: center; }

  .flow { margin-top: 52px; display: flex; align-items: center; gap: 20px; }
  .card { width: 322px; height: 336px; border-radius: 18px; padding: 26px 26px 24px;
    background: linear-gradient(180deg, #141419 0%, #0e0e12 100%);
    border: 1px solid rgba(255,255,255,.075); display: flex; flex-direction: column; }
  .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 12.5px; font-weight: 700; color: #ff6b7d; background: rgba(240,0,43,.12);
    border: 1px solid rgba(240,0,43,.28); }
  .icon { margin-top: 22px; height: 54px; display: flex; align-items: center; }
  .card h3 { margin-top: 18px; font-size: 19px; font-weight: 700; }
  .card p { margin-top: 10px; font-size: 13.5px; line-height: 1.85; color: #8f8f9c; }

  .mini { margin-top: auto; padding-top: 18px; }
  .bar { height: 5px; border-radius: 4px; background: rgba(255,255,255,.12); position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: #ff0033; }
  .stamp { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12px;
    color: #6f6f7c; font-variant-numeric: tabular-nums; }
  .stamp b { color: #d6d6de; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: #9fe3c0;
    background: rgba(60,200,140,.1); border: 1px solid rgba(60,200,140,.24);
    padding: 5px 10px; border-radius: 999px; }

  .arrow { color: #3b3b45; flex: none; }

  .foot { margin-top: 46px; font-size: 13px; color: #6f6f7c; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <h2>{{flowTitle}}</h2>
    <p class="sub">{{flowSub}}</p>

    <div class="flow">
      <div class="card">
        <div class="num">1</div>
        <div class="icon">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <rect x="2.5" y="7.5" width="37" height="27" rx="5" stroke="#ff3b4e" stroke-width="2"/>
            <path d="M17.5 15.6v10.8L27 21z" fill="#ff3b4e"/>
          </svg>
        </div>
        <h3>{{flowStep1Title}}</h3>
        <p>{{flowStep1Desc}}</p>
        <div class="mini">
          <div class="bar"><i style="width:26%"></i></div>
          <div class="stamp"><b>12:34</b><span>48:20</span></div>
        </div>
      </div>

      <svg class="arrow" width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <div class="card">
        <div class="num">2</div>
        <div class="icon">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <rect x="2.5" y="7.5" width="37" height="27" rx="5" stroke="#8d8d9a" stroke-width="2"/>
            <path d="M2.5 14.5h37" stroke="#8d8d9a" stroke-width="2"/>
            <circle cx="8" cy="11" r="1.4" fill="#8d8d9a"/>
            <circle cx="13" cy="11" r="1.4" fill="#8d8d9a"/>
          </svg>
        </div>
        <h3>{{flowStep2Title}}</h3>
        <p>{{flowStep2Desc}}</p>
        <div class="mini">
          <span class="chip">● {{flowStep2Chip}}</span>
        </div>
      </div>

      <svg class="arrow" width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <div class="card">
        <div class="num">3</div>
        <div class="icon">
          <svg width="42" height="42" viewBox="0 0 42 42" fill="none">
            <path d="M33 21a12 12 0 1 1-3.8-8.7" stroke="#ff3b4e" stroke-width="2" stroke-linecap="round"/>
            <path d="M31 5v7h-7" stroke="#ff3b4e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h3>{{flowStep3Title}}</h3>
        <p>{{flowStep3Desc}}</p>
        <div class="mini">
          <div class="bar"><i style="width:26%"></i></div>
          <div class="stamp"><b>{{flowStep3Stamp}}</b><span>48:20</span></div>
        </div>
      </div>
    </div>

    <p class="foot">{{flowFoot}}</p>
  </div>
</body>
</html>

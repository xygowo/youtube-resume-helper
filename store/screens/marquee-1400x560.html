<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>marquee</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1400px; height: 560px; overflow: hidden; position: relative;
    background: #0a0a0d; color: #fff;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  }
  .glow { position: absolute; width: 1000px; height: 1000px; right: -260px; top: -420px;
    background: radial-gradient(circle, rgba(240,0,43,.34) 0%, rgba(240,0,43,0) 62%); }
  .glow.left { left: -360px; right: auto; bottom: -520px; top: auto; width: 900px; height: 900px;
    background: radial-gradient(circle, rgba(86,72,255,.15) 0%, rgba(86,72,255,0) 66%); }
  .mesh { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 70px 70px; }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 70px; padding: 0 88px; }
  .copy { width: 660px; flex: none; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; }
  .brand span { font-size: 19px; font-weight: 700; letter-spacing: .01em; }
  h1 { margin-top: 30px; font-size: 52px; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
  h1 em { font-style: normal; color: #ff3b4e; }
  p { margin-top: 22px; font-size: 16px; line-height: 1.85; color: #9a9aa7; width: 560px; }
  .shot { flex: 1; display: flex; justify-content: center; }
  .shot img { width: 372px; border-radius: 14px;
    box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.09); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow left"></div>
  <div class="mesh"></div>
  <div class="wrap">
    <div class="copy">
      <div class="brand">
        <img src="../../icons/icon128.png" alt="">
        <span>YouTube 續播助手</span>
      </div>
      <h1>關掉瀏覽器，<em>進度還在。</em></h1>
      <p>把觀看進度存在瀏覽器本機，重新打開影片時接續上次的時間點。不依賴網址參數，也不依賴帳號的觀看記錄。</p>
    </div>
    <div class="shot"><img src="../tmp/popup.png" alt=""></div>
  </div>
</body>
</html>
